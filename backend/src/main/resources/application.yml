spring:
  application:
    name: daily-tracker-nutrition
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION:1209600000}
